name: Refresh 1.1.200 lockfile

on:
  push:
    branches: [release/1.1.200-authoritative]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already normalized"
          else
            git commit -m "Normalize 1.1.200 package lock"
            git push
          fi
