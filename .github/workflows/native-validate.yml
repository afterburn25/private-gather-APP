name: Native Validate
on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'plugins/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Ready check
        run: node scripts/check-ready.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --clean --platform android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: private-gather-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-prebuild:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Generate iOS project
        run: npx expo prebuild --clean --platform ios
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Verify Xcode workspace
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          test -n "$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"
