name: Apply Private Gather 1.2.1 Hotfix

on:
  push:
    branches: [hotfix/1.2.1-call-fullscreen-stability-home-return]
    paths:
      - '.github/workflows/apply-1.2.1-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.2.1-call-fullscreen-stability-home-return
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply 1.2.1 source repair
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')).decode())
          PY
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript gate
        run: npm run typecheck
      - name: Main Expo config gate
        env:
          PG_APP_FLAVOR: main
        run: npx expo config --type public >/tmp/pg-main-config.txt
      - name: Messenger Expo config gate
        env:
          PG_APP_FLAVOR: messenger
        run: npx expo config --type public >/tmp/pg-messenger-config.txt
      - name: Commit applied repair
        run: |
          git config user.name "afterburn25"
          git config user.email "afterburn32@gmail.com"
          git add -A
          git commit -m "Private Gather 1.2.1 — full-screen call, stable video and home-return repair"
          git push origin HEAD:hotfix/1.2.1-call-fullscreen-stability-home-return
