name: EAS Native Build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS profile
        required: true
        default: admin
        type: choice
        options: [development, admin, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate Expo token
        shell: bash
        run: test -n "$EXPO_TOKEN" || (echo 'Missing GitHub Actions secret EXPO_TOKEN' && exit 1)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform '${{ inputs.platform }}' --profile '${{ inputs.profile }}' --non-interactive --no-wait
