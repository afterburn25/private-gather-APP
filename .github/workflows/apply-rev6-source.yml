name: Apply Private Gather Native 1.1.200 Rev6 Source Repair

on:
  push:
    branches:
      - hotfix/1.1.200-rev6-fullscreen-ringer
    paths:
      - .github/workflows/apply-rev6-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.1.200-rev6-fullscreen-ringer
          fetch-depth: 0
      - name: Apply exact Rev6 repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')

          p=root/'src/screens/CallScreen.tsx'
          s=p.read_text()
          s=s.replace("import React,{useState} from 'react';", "import React,{memo,useState} from 'react';")
          needle="import ProtectedImage from '../components/ProtectedImage';\n\n"
          assert needle in s
          insert="""const StableRTCVideo=memo(function StableRTCVideo({streamURL,style,mirror=false,zOrder=0}:{streamURL:string;style:any;mirror?:boolean;zOrder?:number}){\n return <RTCView style={style} streamURL={streamURL} objectFit=\"cover\" mirror={mirror} zOrder={zOrder}/>;\n},(a,b)=>a.streamURL===b.streamURL&&a.mirror===b.mirror&&a.zOrder===b.zOrder);\n\n"""
          s=s.replace(needle,needle+insert,1)
          old='{call.remoteUrl?<RTCView key={`remote-${call.remoteRevision||0}-${call.remoteUrl}`} style={s.remoteVideo} streamURL={call.remoteUrl} objectFit="contain" zOrder={0}/>:'
          assert old in s
          s=s.replace(old,'{call.remoteUrl?<StableRTCVideo streamURL={call.remoteUrl} style={s.remoteVideo} zOrder={0}/>:',1)
          old='''{call.localUrl?<RTCView\n        key={`waiting-local-${call.localUrl}`}\n        style={s.waitingLocal}\n        streamURL={call.localUrl}\n        objectFit="cover"\n        mirror\n        zOrder={2}\n      />:'''
          assert old in s
          s=s.replace(old,'{call.localUrl?<StableRTCVideo streamURL={call.localUrl} style={s.waitingLocal} mirror zOrder={2}/>:')
          old='''{call.remoteUrl&&call.localUrl?<View style={[s.pipFrame,{top:topOffset+38}]}><RTCView\n      key={`pip-${call.localUrl}`}\n      style={s.pip}\n      streamURL={call.localUrl}\n      objectFit="cover"\n      mirror\n      zOrder={2}\n   /></View>:null}'''
          assert old in s
          s=s.replace(old,'{call.remoteUrl&&call.localUrl?<View style={[s.pipFrame,{top:topOffset+38}]}><StableRTCVideo streamURL={call.localUrl} style={s.pip} mirror zOrder={2}/></View>:null}')
          s=s.replace("page:{flex:1,backgroundColor:'#02050a'},", "page:{...StyleSheet.absoluteFillObject,backgroundColor:'#02050a',overflow:'hidden'},")
          s=s.replace("remoteVideo:{...StyleSheet.absoluteFill,backgroundColor:'#02050a'},", "remoteVideo:{...StyleSheet.absoluteFillObject,width:'100%',height:'100%',backgroundColor:'#02050a'},")
          s=s.replace("previewStage:{...StyleSheet.absoluteFill,overflow:'hidden',backgroundColor:'#010308',elevation:1},", "previewStage:{...StyleSheet.absoluteFillObject,width:'100%',height:'100%',overflow:'hidden',backgroundColor:'#010308',elevation:1},")
          s=s.replace("waitingLocal:{...StyleSheet.absoluteFill,backgroundColor:'#010308'},", "waitingLocal:{...StyleSheet.absoluteFillObject,width:'100%',height:'100%',backgroundColor:'#010308'},")
          p.write_text(s)

          p=root/'src/calls/CallManager.ts'
          s=p.read_text()
          old="""  private videoConstraints(){\n    // Prefer the camera's wider 4:3 field of view. On a portrait-held phone the native\n    // camera stack rotates this to 3:4, which keeps faces less cropped than forcing 9:16.\n    // CallScreen uses contain for the large self preview and cover only for the small PiP.\n    return {facingMode:'user',width:640,height:480,aspectRatio:4/3,frameRate:24};\n  }\n"""
          assert old in s
          new="""  private videoConstraints(){\n    // Rev6: request a portrait camera stream first so the full-screen preview and\n    // full-screen call surface match the phone viewport instead of starting from a\n    // landscape 4:3 stream that can appear boxed on some Android camera stacks.\n    return {facingMode:'user',width:720,height:1280,aspectRatio:9/16,frameRate:24};\n  }\n"""
          s=s.replace(old,new)
          old="""    const attempts:any[]=[\n      {audio,video:this.videoConstraints()},\n      {audio,video:{facingMode:'user',width:1280,height:720,aspectRatio:16/9}},\n      {audio,video:{facingMode:'user',width:540,height:960,aspectRatio:9/16}},\n      {audio,video:{facingMode:'user'}},\n      {audio,video:true},\n    ];\n"""
          assert old in s
          new="""    const attempts:any[]=[\n      {audio,video:this.videoConstraints()},\n      {audio,video:{facingMode:'user',width:540,height:960,aspectRatio:9/16}},\n      {audio,video:{facingMode:'user',width:640,height:480,aspectRatio:4/3}},\n      {audio,video:{facingMode:'user',width:1280,height:720,aspectRatio:16/9}},\n      {audio,video:{facingMode:'user'}},\n      {audio,video:true},\n    ];\n"""
          s=s.replace(old,new)
          p.write_text(s)

          p=root/'src/calls/CallRingtone.ts'
          p.write_text("""import {Vibration} from 'react-native';\nimport {createAudioPlayer,preload,setAudioModeAsync,setIsAudioActiveAsync} from 'expo-audio';\n\nconst source=require('../../assets/audio/calling.mp3');\nlet player:any=null;\nlet active=false;\nlet generation=0;\ntry{preload(source)}catch{}\n\nexport async function startCallRingtone(){\n  if(active)return true;\n  const token=++generation;\n  active=true;\n  Vibration.vibrate([0,700,300,700,300,1100],true);\n  try{\n    await setIsAudioActiveAsync(true);\n    if(!active||token!==generation)return false;\n    await setAudioModeAsync({playsInSilentMode:true,shouldPlayInBackground:true,interruptionMode:'doNotMix'});\n    if(!active||token!==generation)return false;\n    if(!player)player=createAudioPlayer(source,{updateInterval:500,downloadFirst:true});\n    // Rev6: native audio looping owns the complete 8.307-second media cycle.\n    // No playback-status callback is allowed to seek/restart the ringtone early.\n    player.loop=true;\n    player.volume=1;\n    try{await player.seekTo(0)}catch{}\n    if(!active||token!==generation)return false;\n    player.play();\n    return true;\n  }catch(e){\n    if(token===generation)active=false;\n    Vibration.cancel();\n    console.warn('Private Gather ringtone audio failed',String((e as any)?.message||e));\n    return false;\n  }\n}\n\nexport async function stopCallRingtone(){\n  active=false;\n  generation++;\n  Vibration.cancel();\n  try{player && (player.loop=false)}catch{}\n  try{player?.pause?.()}catch{}\n  try{await player?.seekTo?.(0)}catch{}\n}\n\nexport function isCallRingtoneActive(){return active;}\n""")

          p=root/'plugins/withPrivateGatherNativeCalling.js'
          s=p.read_text()
          needle='''  @ReactMethod fun openFullScreenIntentSettings(promise: Promise){\n    try{\n      if(Build.VERSION.SDK_INT>=34){\n        val intent=Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:\\${reactContext.packageName}"))\n        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);reactContext.startActivity(intent)\n      }\n      promise.resolve(true)\n    }catch(e:Throwable){promise.reject("PG_FULL_SCREEN_SETTINGS",e)}\n  }\n'''
          assert needle in s
          addition=needle+'''  @ReactMethod fun cancelIncomingCallNotification(callId: Double, promise: Promise){\n    try{\n      val requestCode=callId.toInt()\n      val manager=reactContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager\n      manager.cancel(41000 + (requestCode and 0x0fff))\n      promise.resolve(true)\n    }catch(e:Throwable){promise.reject("PG_CALL_NOTIFICATION_CANCEL",e)}\n  }\n'''
          s=s.replace(needle,addition,1)
          p.write_text(s)

          p=root/'App.tsx'
          s=p.read_text()
          needle="  const callEnded=()=>{stopCallRingtone().catch(()=>{});setCall(null)};\n\n"
          assert needle in s
          s=s.replace(needle,"""  const callEnded=()=>{stopCallRingtone().catch(()=>{});setCall(null)};\n  const cancelNativeCallNotification=async(id:number)=>{\n    if(Platform.OS!=='android'||!id)return;\n    try{await (NativeModules as any).PrivateGatherCallAccess?.cancelIncomingCallNotification?.(id)}catch{}\n  };\n\n""",1)
          old="    if(foreground)startCallRingtone().catch(()=>{});"
          assert old in s
          s=s.replace(old,"    if(foreground){await cancelNativeCallNotification(id);await startCallRingtone().catch(()=>false);}",1)
          p.write_text(s)

          p=root/'scripts/check-ready.mjs'
          s=p.read_text()
          old="const callSource = fs.readFileSync(path.join(root,'src','calls','CallManager.ts'),'utf8');"
          assert old in s
          s=s.replace(old,old+"\nconst callScreenSource = fs.readFileSync(path.join(root,'src','screens','CallScreen.tsx'),'utf8');\nconst ringtoneSource = fs.readFileSync(path.join(root,'src','calls','CallRingtone.ts'),'utf8');\nconst nativeCallPluginSource = fs.readFileSync(path.join(root,'plugins','withPrivateGatherNativeCalling.js'),'utf8');",1)
          needle="""callSource.includes('const mark=()=>{if(signalId)this.seenSignalIds.add(signalId)}')\n  ? ok('CallManager marks signals only after processing')\n  : fail('CallManager signal retry-safety guard missing');\n"""
          assert needle in s
          s=s.replace(needle,needle+"""callScreenSource.includes('const StableRTCVideo=memo') && !callScreenSource.includes('remoteRevision||0')\n  ? ok('call video surfaces keep stable RTCView identity')\n  : fail('call video surfaces can still remount on receiver-state revisions');\n!callScreenSource.includes('objectFit=\"contain\"')\n  ? ok('all full-screen call video surfaces use cover')\n  : fail('a call video surface still uses contain');\ncallSource.includes("width:720,height:1280,aspectRatio:9/16")\n  ? ok('portrait-first camera constraints for full-screen preview')\n  : fail('portrait-first camera constraints missing');\nringtoneSource.includes('player.loop=true') && !ringtoneSource.includes('didJustFinish')\n  ? ok('ringtone loops in native audio engine without early status restart')\n  : fail('ringtone still uses event-driven restart logic');\nnativeCallPluginSource.includes('cancelIncomingCallNotification')\n  ? ok('foreground app can cancel Android system call ringtone')\n  : fail('Android call-notification cancellation bridge missing');\n""",1)
          p.write_text(s)

          (root/'RELEASE-1.1.200-REV6.md').write_text("""# Private Gather Native App 1.1.200 Rev6 — Full-Screen Video & Single-Ringer Repair\n\nPrepared from the exact merged Rev5 baseline. Semantic app version remains 1.1.200 until device acceptance.\n\n## Physical-device fixes\n- Remote video uses full-screen cover instead of contain.\n- RTC video surfaces are memoized by stream identity and no longer remount on receiver revision updates.\n- Caller/incoming preview requests portrait 9:16 camera capture first, with 4:3/16:9 fallbacks.\n- Android foreground incoming calls cancel the matching system call notification before starting the in-app ringtone, eliminating double-ringer overlap.\n- In-app ringtone uses the native audio engine loop for the complete 8.307-second ringtone asset; event-driven early restarts are removed.\n\n## Web companion requirement\nA separate website Update Center hotfix accompanies Rev6 to elect exactly one browser tab as ringtone owner while all tabs may still display the incoming-call UI.\n\nStatus: prepared candidate only. GitHub native validation and physical-device acceptance are required before promotion.\n""")
          PY
          git diff --check
          git status --short
          git config user.name "afterburn25"
          git config user.email "afterburn32@gmail.com"
          git add App.tsx src/screens/CallScreen.tsx src/calls/CallManager.ts src/calls/CallRingtone.ts plugins/withPrivateGatherNativeCalling.js scripts/check-ready.mjs RELEASE-1.1.200-REV6.md
          git commit -m "Repair full-screen call video and ringtone ownership"
          git push origin HEAD:hotfix/1.1.200-rev6-fullscreen-ringer
