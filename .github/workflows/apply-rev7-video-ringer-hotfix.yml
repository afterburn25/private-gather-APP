name: Apply Private Gather 1.1.200 Rev7 Video and Ringer Hotfix

on:
  push:
    branches:
      - hotfix/1.1.200-rev7-video-ringer
    paths:
      - .github/workflows/apply-rev7-video-ringer-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.1.200-rev7-video-ringer
          fetch-depth: 0

      - name: Apply exact Rev7 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(s.replace(old,new,1))

          replace_exact('App.tsx',
          "    setCall(prev=>prev?.id&&prev.id!==id?prev:{id,mode,peer,status:'incoming',photoUrl,incoming:true});",
          "    setCall(prev=>prev?.id&&prev.id!==id?prev:{...prev,id,mode,peer,status:'incoming',photoUrl,incoming:true});")

          replace_exact('src/screens/CallScreen.tsx',
          "import {Pressable,StatusBar,StyleSheet,Text,View} from 'react-native';",
          "import {Pressable,StatusBar,StyleSheet,Text,useWindowDimensions,View} from 'react-native';")
          replace_exact('src/screens/CallScreen.tsx',
          " const insets=useSafeAreaInsets();\n const [muted,setMuted]=useState(false);const [videoOn,setVideoOn]=useState(call.mode==='video');",
          " const insets=useSafeAreaInsets();\n const {width,height}=useWindowDimensions();\n const [muted,setMuted]=useState(false);const [videoOn,setVideoOn]=useState(call.mode==='video');")
          replace_exact('src/screens/CallScreen.tsx',
          " return <View style={s.page}><StatusBar hidden barStyle=\"light-content\"/>",
          " return <View style={[s.page,{width,height}]}><StatusBar hidden barStyle=\"light-content\"/>")
          replace_exact('src/screens/CallScreen.tsx',
          " page:{...StyleSheet.absoluteFill,backgroundColor:'#02050a',overflow:'hidden'},",
          " page:{flex:1,width:'100%',height:'100%',backgroundColor:'#02050a',overflow:'hidden'},")

          replace_exact('src/calls/CallManager.ts',
          "    // Samsung and several Android camera stacks do not reliably allow a second\n    // getUserMedia request while the preview stream still owns the camera.\n    this.clearIncomingPreview();\n    if(preparedLocal){\n      this.local=preparedLocal;\n    }else{\n      this.local=await this.captureLocal(this.mode,true);\n    }",
          "    // Rev7: transfer the already-running incoming video preview into the live\n    // call instead of stopping/reopening the camera. Add only a microphone track.\n    // This removes the visible camera blink at Answer on Android/Samsung devices.\n    let promotedPreview:MediaStream|undefined;\n    if(!preparedLocal&&this.mode==='video'&&this.preview&&this.previewCallId===callId){\n      promotedPreview=this.preview;this.preview=undefined;this.previewCallId=0;\n      try{\n        const mic=await this.captureLocal('voice',true);\n        for(const track of mic.getAudioTracks?.()||[])promotedPreview.addTrack(track);\n      }catch(e){\n        try{promotedPreview.getTracks().forEach(t=>t.stop())}catch{}\n        throw e;\n      }\n    }else{\n      this.clearIncomingPreview();\n    }\n    if(preparedLocal){\n      this.local=preparedLocal;\n    }else if(promotedPreview){\n      this.local=promotedPreview;\n    }else{\n      this.local=await this.captureLocal(this.mode,true);\n    }")

          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          'import android.graphics.Color\\nimport android.graphics.SurfaceTexture',
          'import android.graphics.Color\\nimport android.graphics.Matrix\\nimport android.graphics.RectF\\nimport android.graphics.SurfaceTexture')
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '    private const val CHANNEL_ID = "pg-calls-v199"',
          '    private const val CHANNEL_ID = "pg-calls-v202"')
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '  private fun showIncomingCall(data: Map<String, String>) {\\n    val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager\\n    val sound = Uri.parse("android.resource://$packageName/raw/calling")',
          '  private fun showIncomingCall(data: Map<String, String>) {\\n    val callId = data["call_id"] ?: return\\n    val now = System.currentTimeMillis()\\n    val prefs = getSharedPreferences("private-gather-call-alert-v202", Context.MODE_PRIVATE)\\n    val lastId = prefs.getString("last_call_id", "") ?: ""\\n    val lastAt = prefs.getLong("last_call_at", 0L)\\n    if (lastId == callId && now - lastAt < 120000L) return\\n    prefs.edit().putString("last_call_id", callId).putLong("last_call_at", now).apply()\\n    val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager\\n    val sound = Uri.parse("android.resource://$packageName/raw/calling")')
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '\\n    val callId = data["call_id"] ?: return\\n    val caller = data["caller_name"] ?: "Private Gather member"',
          '\\n    val caller = data["caller_name"] ?: "Private Gather member"')
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '      .setAutoCancel(false)\\n      .setSound(sound)',
          '      .setAutoCancel(false)\\n      .setOnlyAlertOnce(true)\\n      .setSound(sound)')
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '  private var camera:Camera?=null\\n  private lateinit var preview:TextureView\\n  private var videoCall=false',
          '  private var camera:Camera?=null\\n  private lateinit var preview:TextureView\\n  private var videoCall=false\\n  private var previewBufferWidth=0\\n  private var previewBufferHeight=0')
          old_camera='''  private fun startCamera(){\\n    if(!videoCall||camera!=null||checkSelfPermission(Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED||!preview.isAvailable)return\\n    try{\\n      val id=frontCameraId();if(id<0)return\\n      val info=Camera.CameraInfo();Camera.getCameraInfo(id,info)\\n      val opened=Camera.open(id)\\n      val params=opened.parameters\\n      params.supportedPreviewSizes?.minByOrNull{abs((it.width*it.height)-(640*480))}?.let{params.setPreviewSize(it.width,it.height)}\\n      if(params.isZoomSupported)params.zoom=0\\n      opened.parameters=params\\n      val rotation=windowManager.defaultDisplay.rotation\\n      val degrees=when(rotation){Surface.ROTATION_90->90;Surface.ROTATION_180->180;Surface.ROTATION_270->270;else->0}\\n      var result=(info.orientation+degrees)%360;result=(360-result)%360\\n      opened.setDisplayOrientation(result)\\n      opened.setPreviewTexture(preview.surfaceTexture);opened.startPreview();camera=opened\\n    }catch(_:Throwable){stopCamera()}\\n  }'''
          new_camera='''  private fun applyPreviewCenterCrop(){\\n    val viewWidth=preview.width;val viewHeight=preview.height\\n    if(viewWidth<=0||viewHeight<=0||previewBufferWidth<=0||previewBufferHeight<=0)return\\n    val viewRect=RectF(0f,0f,viewWidth.toFloat(),viewHeight.toFloat())\\n    val bufferRect=RectF(0f,0f,previewBufferWidth.toFloat(),previewBufferHeight.toFloat())\\n    val centerX=viewRect.centerX();val centerY=viewRect.centerY()\\n    bufferRect.offset(centerX-bufferRect.centerX(),centerY-bufferRect.centerY())\\n    val matrix=Matrix()\\n    matrix.setRectToRect(viewRect,bufferRect,Matrix.ScaleToFit.FILL)\\n    val scale=kotlin.math.max(viewWidth.toFloat()/previewBufferWidth.toFloat(),viewHeight.toFloat()/previewBufferHeight.toFloat())\\n    matrix.postScale(scale,scale,centerX,centerY)\\n    preview.setTransform(matrix)\\n  }\\n  private fun startCamera(){\\n    if(!videoCall||camera!=null||checkSelfPermission(Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED||!preview.isAvailable)return\\n    try{\\n      val id=frontCameraId();if(id<0)return\\n      val info=Camera.CameraInfo();Camera.getCameraInfo(id,info)\\n      val opened=Camera.open(id)\\n      val params=opened.parameters\\n      val chosen=params.supportedPreviewSizes?.filter{it.width>=640&&it.height>=360}?.minByOrNull{\\n        abs((it.width.toFloat()/it.height.toFloat())-(16f/9f))*100000f + abs((it.width*it.height)-(1280*720)).toFloat()/1000f\\n      } ?: params.supportedPreviewSizes?.firstOrNull()\\n      if(chosen!=null)params.setPreviewSize(chosen.width,chosen.height)\\n      if(params.isZoomSupported)params.zoom=0\\n      opened.parameters=params\\n      val rotation=windowManager.defaultDisplay.rotation\\n      val degrees=when(rotation){Surface.ROTATION_90->90;Surface.ROTATION_180->180;Surface.ROTATION_270->270;else->0}\\n      var result=(info.orientation+degrees)%360;result=(360-result)%360\\n      opened.setDisplayOrientation(result)\\n      if(chosen!=null){\\n        previewBufferWidth=if(result==90||result==270)chosen.height else chosen.width\\n        previewBufferHeight=if(result==90||result==270)chosen.width else chosen.height\\n      }\\n      opened.setPreviewTexture(preview.surfaceTexture);opened.startPreview();camera=opened\\n      preview.post{applyPreviewCenterCrop()}\\n    }catch(_:Throwable){stopCamera()}\\n  }'''
          replace_exact('plugins/withPrivateGatherNativeCalling.js',old_camera,new_camera)
          replace_exact('plugins/withPrivateGatherNativeCalling.js',
          '  override fun onSurfaceTextureSizeChanged(surface:SurfaceTexture,width:Int,height:Int){}',
          '  override fun onSurfaceTextureSizeChanged(surface:SurfaceTexture,width:Int,height:Int){applyPreviewCenterCrop()}')

          Path('RELEASE-1.1.200-REV7.md').write_text('''# Private Gather Native 1.1.200 Rev7 — Video Surface & Incoming Ringer Stability Hotfix\n\nPrepared after physical-device Rev6 testing. Semantic app version remains 1.1.200.\n\n## Fixes\n- Preserves the same incoming preview stream across duplicate incoming-call events.\n- Promotes the pre-answer camera stream into the answered call and adds only the microphone, avoiding camera teardown/reopen blink.\n- Uses an explicit full-window flex call root for local and remote RTC video surfaces.\n- Deduplicates repeated Android incoming-call notifications for the same call for 120 seconds.\n- Uses setOnlyAlertOnce so repeated notification updates cannot restart the ringtone.\n- Moves Android incoming calls to a new notification channel so corrected alert behavior is applied cleanly.\n- Selects a 16:9 native preview size when available and applies center-crop transform for a true full-screen incoming preview.\n\nStatus: prepared candidate only until physical-device acceptance.\n''')
          PY

          git config user.name "afterburn25"
          git config user.email "afterburn32@gmail.com"
          git add App.tsx src/screens/CallScreen.tsx src/calls/CallManager.ts plugins/withPrivateGatherNativeCalling.js RELEASE-1.1.200-REV7.md
          git commit -m "Private Gather Native 1.1.200 Rev7 video and ringer stability hotfix"
          git push origin HEAD:hotfix/1.1.200-rev7-video-ringer
