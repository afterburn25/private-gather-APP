name: Fix 1.1.200 App syntax

on:
  push:
    branches: [release/1.1.200-authoritative]
    paths:
      - '.github/workflows/fix-1.1.200-app-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact malformed navigator closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('App.tsx')
          s=p.read_text()
          old="fontWeight:'900')}})}>"
          new="fontWeight:'900'}})}>"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one malformed closure, found {count}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix 1.1.200 App navigator syntax"
          git push
