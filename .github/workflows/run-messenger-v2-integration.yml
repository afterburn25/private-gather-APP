name: Run Messenger V2 Integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-messenger-v2-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-messenger-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply integration
        run: python3 scripts/apply-native-messenger-v2-integration.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit feature branch application source
        run: |
          git config user.name "afterburn25"
          git config user.email "afterburn32@gmail.com"
          git add App.tsx src/calls/CallManager.ts plugins/withPrivateGatherNativeCalling.js scripts/check-ready.mjs package-lock.json
          git commit -m "Integrate Private Gather Messenger V2 two-app runtime"
          git push origin HEAD:feature/native-messenger-v2
